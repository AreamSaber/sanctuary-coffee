# 开发环境配置（请用环境变量覆盖密码，勿提交真实口令）
spring:
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/coffee_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# 日志级别（开发环境）
logging:
  level:
    root: info
    com.coffee: debug
    com.coffee.mapper: debug

# 开发环境端口
server:
  port: 8080
